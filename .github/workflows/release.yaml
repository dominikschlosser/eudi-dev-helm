name: Release

on:
  push:
    branches: [main]
    paths:
      - Chart.yaml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  HELM_VERSION: v3.22.0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      # A chart version is published once. Its git tag marks it as released.
      - name: Publish a new chart version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          registry="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          name=$(helm show chart . | sed -n 's/^name: //p')
          version=$(helm show chart . | sed -n 's/^version: //p')
          tag="$name-$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag is already released"
            exit 0
          fi
          helm dependency build .
          helm package . --destination dist
          helm push "dist/$tag.tgz" "$registry"
          gh release create "$tag" "dist/$tag.tgz" --title "$tag" \
            --notes "Install with \`helm install my-release $registry/$name --version $version\`. See [the changelog](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/$tag/CHANGELOG.md)."
