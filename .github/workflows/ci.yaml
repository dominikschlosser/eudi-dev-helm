name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  HELM_VERSION: v3.22.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: helm/chart-testing-action@v2.8.0

      # Pull requests that change the packaged chart must raise its version.
      - name: Lint
        run: |
          bump=false
          if [ "${{ github.event_name }}" = "pull_request" ] &&
            ! git diff --quiet origin/main...HEAD -- Chart.yaml Chart.lock values.yaml templates README.md LICENSE .helmignore; then
            bump=true
          fi
          ct lint --config ct.yaml --check-version-increment=$bump

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check that the README matches values.yaml
        run: |
          npx -y @bitnami/readme-generator-for-helm@2 -v values.yaml -r README.md
          git diff --exit-code -- README.md || {
            echo "::error::Regenerate the README with make readme (see CONTRIBUTING.md)"
            exit 1
          }

  e2e:
    name: e2e (eudi-dev ${{ matrix.image }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # release: the image the chart ships with. main: eudi-dev's main branch, so
        # chart changes for the next eudi-dev release are tested before it ships.
        image: [release, main]
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: helm/kind-action@v1
        with:
          install_only: true

      - uses: actions/checkout@v4
        if: matrix.image == 'main'
        with:
          repository: dominikschlosser/eudi-dev
          path: eudi-dev

      - name: Build eudi-dev from main
        if: matrix.image == 'main'
        run: |
          docker build -t ghcr.io/dominikschlosser/eudi-dev:main-ci --build-arg VERSION=main eudi-dev
          {
            echo "IMAGE_TAG=main-ci"
            echo "LOAD_IMAGE=ghcr.io/dominikschlosser/eudi-dev:main-ci"
          } >> "$GITHUB_ENV"

      - name: Install the chart and check the wallet
        run: test/e2e.sh --kind
