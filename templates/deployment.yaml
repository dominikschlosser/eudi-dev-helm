{{- include "eudi-dev.validateValues" . }}
apiVersion: {{ include "common.capabilities.deployment.apiVersion" . }}
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: wallet
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- if .Values.updateStrategy }}
  strategy: {{- toYaml .Values.updateStrategy | nindent 4 }}
  {{- end }}
  {{- $podLabels := include "common.tplvalues.merge" ( dict "values" ( list .Values.podLabels .Values.commonLabels ) "context" . ) }}
  selector:
    matchLabels: {{- include "common.labels.matchLabels" ( dict "customLabels" $podLabels "context" $ ) | nindent 6 }}
      app.kubernetes.io/component: wallet
  template:
    metadata:
      labels: {{- include "common.labels.standard" ( dict "customLabels" $podLabels "context" $ ) | nindent 8 }}
        app.kubernetes.io/component: wallet
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/configmap: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.podAnnotations }}
        {{- include "common.tplvalues.render" ( dict "value" .Values.podAnnotations "context" $ ) | nindent 8 }}
        {{- end }}
    spec:
      {{- include "eudi-dev.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ template "eudi-dev.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      {{- if .Values.hostAliases }}
      hostAliases: {{- include "common.tplvalues.render" (dict "value" .Values.hostAliases "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity: {{- include "common.tplvalues.render" ( dict "value" .Values.affinity "context" $) | nindent 8 }}
      {{- else }}
      affinity:
        podAffinity: {{- include "common.affinities.pods" (dict "type" .Values.podAffinityPreset "component" "wallet" "customLabels" $podLabels "context" $) | nindent 10 }}
        podAntiAffinity: {{- include "common.affinities.pods" (dict "type" .Values.podAntiAffinityPreset "component" "wallet" "customLabels" $podLabels "context" $) | nindent 10 }}
        nodeAffinity: {{- include "common.affinities.nodes" (dict "type" .Values.nodeAffinityPreset.type "key" .Values.nodeAffinityPreset.key "values" .Values.nodeAffinityPreset.values) | nindent 10 }}
      {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector: {{- include "common.tplvalues.render" ( dict "value" .Values.nodeSelector "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations: {{- include "common.tplvalues.render" (dict "value" .Values.tolerations "context" .) | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName | quote }}
      {{- end }}
      {{- if .Values.schedulerName }}
      schedulerName: {{ .Values.schedulerName | quote }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{- include "common.tplvalues.render" (dict "value" .Values.topologySpreadConstraints "context" .) | nindent 8 }}
      {{- end }}
      {{- if .Values.podSecurityContext.enabled }}
      securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.podSecurityContext "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
      {{- if .Values.initContainers }}
      initContainers: {{- include "common.tplvalues.render" (dict "value" .Values.initContainers "context" $) | nindent 8 }}
      {{- end }}
      containers:
        - name: eudi-dev
          image: {{ template "eudi-dev.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.containerSecurityContext "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.diagnosticMode.enabled }}
          command: {{- include "common.tplvalues.render" (dict "value" .Values.diagnosticMode.command "context" $) | nindent 12 }}
          {{- else if .Values.command }}
          command: {{- include "common.tplvalues.render" (dict "value" .Values.command "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.diagnosticMode.enabled }}
          args: {{- include "common.tplvalues.render" (dict "value" .Values.diagnosticMode.args "context" $) | nindent 12 }}
          {{- else if .Values.args }}
          args: {{- include "common.tplvalues.render" (dict "value" .Values.args "context" $) | nindent 12 }}
          {{- else }}
          args:
            - wallet
            - serve
            - --port={{ .Values.containerPorts.http }}
            - --base-url={{ include "eudi-dev.baseURL" . }}
            - --mode={{ .Values.validationMode }}
            {{- if .Values.autoAccept }}
            - --auto-accept
            {{- end }}
            {{- if .Values.generatePID }}
            - --pid
            {{- end }}
            {{- if .Values.demo.enabled }}
            - --demo
            {{- if .Values.demo.reset }}
            - --demo-reset={{ .Values.demo.reset }}
            {{- end }}
            {{- end }}
            {{- if ne (toString .Values.tls.verify) "" }}
            - --tls-verify={{ .Values.tls.verify }}
            {{- end }}
            {{- if .Values.tls.existingCASecret }}
            - --tls-ca=/opt/eudi-dev/ca/{{ .Values.tls.existingCASecretKey }}
            {{- end }}
            {{- if ne (toString .Values.haip) "" }}
            - --haip={{ .Values.haip }}
            {{- end }}
            {{- if .Values.statusList }}
            - --status-list
            {{- end }}
            {{- if .Values.adhocDisplayImages }}
            - --adhoc-display-images
            {{- end }}
            {{- if include "eudi-dev.vciVersion" . }}
            - --vci-version={{ include "eudi-dev.vciVersion" . }}
            {{- end }}
            {{- if .Values.issuance.clientId }}
            - --vci-client-id={{ tpl .Values.issuance.clientId . }}
            {{- end }}
            {{- if .Values.issuance.redirectURI }}
            - --vci-redirect-uri={{ tpl .Values.issuance.redirectURI . }}
            {{- end }}
            {{- if .Values.issuance.clientAttestation }}
            - --client-attestation
            {{- end }}
            {{- if .Values.issuance.keyAttestationLevel }}
            - --key-attestation-level={{ .Values.issuance.keyAttestationLevel }}
            {{- end }}
            {{- if .Values.presentation.sessionTranscript }}
            - --session-transcript={{ .Values.presentation.sessionTranscript }}
            {{- end }}
            {{- if .Values.presentation.preferredFormat }}
            - --preferred-format={{ .Values.presentation.preferredFormat }}
            {{- end }}
            {{- if .Values.presentation.requireEncryptedRequest }}
            - --require-encrypted-request
            {{- end }}
            {{- if .Values.demoIssuer.clientAuth }}
            - --demo-issuer-client-auth={{ .Values.demoIssuer.clientAuth }}
            {{- end }}
            {{- if or .Values.demoVerifier.trustAnchors .Values.demoVerifier.existingTrustAnchorsSecret }}
            - --demo-verifier-trust-anchor=/opt/eudi-dev/trust-anchors/trust-anchors.pem
            {{- end }}
            {{- if or .Values.imprint.html .Values.imprint.existingConfigMap }}
            - --imprint-file=/opt/eudi-dev/imprint/imprint.html
            {{- end }}
            {{- if .Values.holderKey.existingSecret }}
            - --key=/opt/eudi-dev/holder-key/{{ .Values.holderKey.existingSecretKey }}
            {{- end }}
            {{- if .Values.issuerKey.existingSecret }}
            - --issuer-key=/opt/eudi-dev/issuer-key/{{ .Values.issuerKey.existingSecretKey }}
            {{- end }}
            {{- if or .Values.credentialTemplates.templates .Values.credentialTemplates.existingConfigMap }}
            - --templates-dir=/opt/eudi-dev/templates
            {{- end }}
            {{- range include "eudi-dev.importCredentialPaths" . | splitList "\n" | compact }}
            - --credential={{ . }}
            {{- end }}
            {{- if .Values.extraArgs }}
            {{- include "common.tplvalues.render" (dict "value" .Values.extraArgs "context" $) | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if .Values.lifecycleHooks }}
          lifecycle: {{- include "common.tplvalues.render" (dict "value" .Values.lifecycleHooks "context" $) | nindent 12 }}
          {{- end }}
          env:
            - name: EUDI_DEV_LOG_FORMAT
              value: {{ .Values.logFormat | quote }}
            - name: EUDI_DEV_STORAGE
              value: {{ include "eudi-dev.storage" . | quote }}
            - name: EUDI_DEV_SEED
              valueFrom:
                secretKeyRef:
                  name: {{ include "eudi-dev.seedSecretName" . }}
                  key: {{ include "eudi-dev.seedSecretKey" . }}
            {{- if and (eq .Values.storage.type "postgresql") (include "eudi-dev.databaseSecretName" .) }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "eudi-dev.databaseSecretName" . }}
                  key: {{ include "eudi-dev.databaseSecretKey" . }}
            {{- end }}
            {{- if .Values.outboundProxy.httpsProxy }}
            - name: HTTPS_PROXY
              value: {{ .Values.outboundProxy.httpsProxy | quote }}
            {{- end }}
            {{- if .Values.outboundProxy.httpProxy }}
            - name: HTTP_PROXY
              value: {{ .Values.outboundProxy.httpProxy | quote }}
            {{- end }}
            {{- if or .Values.outboundProxy.httpsProxy .Values.outboundProxy.httpProxy .Values.outboundProxy.noProxy }}
            - name: NO_PROXY
              value: {{ include "eudi-dev.noProxy" . | quote }}
            {{- end }}
            {{- if .Values.extraEnvVars }}
            {{- include "common.tplvalues.render" (dict "value" .Values.extraEnvVars "context" $) | nindent 12 }}
            {{- end }}
          {{- if or .Values.extraEnvVarsCM .Values.extraEnvVarsSecret }}
          envFrom:
            {{- if .Values.extraEnvVarsCM }}
            - configMapRef:
                name: {{ include "common.tplvalues.render" (dict "value" .Values.extraEnvVarsCM "context" $) }}
            {{- end }}
            {{- if .Values.extraEnvVarsSecret }}
            - secretRef:
                name: {{ include "common.tplvalues.render" (dict "value" .Values.extraEnvVarsSecret "context" $) }}
            {{- end }}
          {{- end }}
          {{- if .Values.resources }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- else if ne .Values.resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" .Values.resourcesPreset) | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPorts.http }}
            - name: issuer
              containerPort: {{ add1 .Values.containerPorts.http }}
            {{- if .Values.extraContainerPorts }}
            {{- include "common.tplvalues.render" (dict "value" .Values.extraContainerPorts "context" $) | nindent 12 }}
            {{- end }}
          {{- if not .Values.diagnosticMode.enabled }}
          {{- if .Values.customLivenessProbe }}
          livenessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.customLivenessProbe "context" $) | nindent 12 }}
          {{- else if .Values.livenessProbe.enabled }}
          livenessProbe: {{- include "common.tplvalues.render" (dict "value" (omit .Values.livenessProbe "enabled") "context" $) | nindent 12 }}
            httpGet:
              path: /healthz
              port: http
          {{- end }}
          {{- if .Values.customReadinessProbe }}
          readinessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.customReadinessProbe "context" $) | nindent 12 }}
          {{- else if .Values.readinessProbe.enabled }}
          readinessProbe: {{- include "common.tplvalues.render" (dict "value" (omit .Values.readinessProbe "enabled") "context" $) | nindent 12 }}
            httpGet:
              path: /readyz
              port: http
          {{- end }}
          {{- if .Values.customStartupProbe }}
          startupProbe: {{- include "common.tplvalues.render" (dict "value" .Values.customStartupProbe "context" $) | nindent 12 }}
          {{- else if .Values.startupProbe.enabled }}
          startupProbe: {{- include "common.tplvalues.render" (dict "value" (omit .Values.startupProbe "enabled") "context" $) | nindent 12 }}
            httpGet:
              path: /healthz
              port: http
          {{- end }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            - name: empty-dir
              mountPath: /tmp
              subPath: tmp-dir
            {{- if .Values.tls.existingCASecret }}
            - name: ca-certificates
              mountPath: /opt/eudi-dev/ca
              readOnly: true
            {{- end }}
            {{- if or .Values.demoVerifier.trustAnchors .Values.demoVerifier.existingTrustAnchorsSecret }}
            - name: trust-anchors
              mountPath: /opt/eudi-dev/trust-anchors
              readOnly: true
            {{- end }}
            {{- if or .Values.imprint.html .Values.imprint.existingConfigMap }}
            - name: imprint
              mountPath: /opt/eudi-dev/imprint
              readOnly: true
            {{- end }}
            {{- if .Values.holderKey.existingSecret }}
            - name: holder-key
              mountPath: /opt/eudi-dev/holder-key
              readOnly: true
            {{- end }}
            {{- if .Values.issuerKey.existingSecret }}
            - name: issuer-key
              mountPath: /opt/eudi-dev/issuer-key
              readOnly: true
            {{- end }}
            {{- if or .Values.credentialTemplates.templates .Values.credentialTemplates.existingConfigMap }}
            - name: credential-templates
              mountPath: /opt/eudi-dev/templates
              readOnly: true
            {{- end }}
            {{- if include "eudi-dev.importCredentialPaths" . }}
            - name: import-credentials
              mountPath: /opt/eudi-dev/credentials
              readOnly: true
            {{- end }}
            {{- if .Values.extraVolumeMounts }}
            {{- include "common.tplvalues.render" (dict "value" .Values.extraVolumeMounts "context" $) | nindent 12 }}
            {{- end }}
        {{- if .Values.sidecars }}
        {{- include "common.tplvalues.render" ( dict "value" .Values.sidecars "context" $) | nindent 8 }}
        {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (include "common.names.fullname" .) (tpl .Values.persistence.existingClaim .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: empty-dir
          emptyDir: {}
        {{- if .Values.tls.existingCASecret }}
        - name: ca-certificates
          secret:
            secretName: {{ tpl .Values.tls.existingCASecret . }}
        {{- end }}
        {{- if .Values.demoVerifier.existingTrustAnchorsSecret }}
        - name: trust-anchors
          secret:
            secretName: {{ tpl .Values.demoVerifier.existingTrustAnchorsSecret . }}
            items:
              - key: {{ .Values.demoVerifier.existingTrustAnchorsSecretKey }}
                path: trust-anchors.pem
        {{- else if .Values.demoVerifier.trustAnchors }}
        - name: trust-anchors
          configMap:
            name: {{ include "eudi-dev.configMapName" . }}
            items:
              - key: trust-anchors.pem
                path: trust-anchors.pem
        {{- end }}
        {{- if or .Values.imprint.html .Values.imprint.existingConfigMap }}
        - name: imprint
          configMap:
            name: {{ ternary (tpl .Values.imprint.existingConfigMap .) (include "eudi-dev.configMapName" .) (not (empty .Values.imprint.existingConfigMap)) }}
            items:
              - key: {{ ternary .Values.imprint.existingConfigMapKey "imprint.html" (not (empty .Values.imprint.existingConfigMap)) }}
                path: imprint.html
        {{- end }}
        {{- if .Values.holderKey.existingSecret }}
        - name: holder-key
          secret:
            secretName: {{ tpl .Values.holderKey.existingSecret . }}
        {{- end }}
        {{- if .Values.issuerKey.existingSecret }}
        - name: issuer-key
          secret:
            secretName: {{ tpl .Values.issuerKey.existingSecret . }}
        {{- end }}
        {{- if .Values.credentialTemplates.existingConfigMap }}
        - name: credential-templates
          configMap:
            name: {{ tpl .Values.credentialTemplates.existingConfigMap . }}
        {{- else if .Values.credentialTemplates.templates }}
        - name: credential-templates
          configMap:
            name: {{ include "eudi-dev.configMapName" . }}
            items:
              {{- range $name, $template := .Values.credentialTemplates.templates }}
              - key: template-{{ include "eudi-dev.templateFileName" $name }}
                path: {{ include "eudi-dev.templateFileName" $name }}
              {{- end }}
        {{- end }}
        {{- if .Values.importCredentials.existingConfigMap }}
        - name: import-credentials
          configMap:
            name: {{ tpl .Values.importCredentials.existingConfigMap . }}
        {{- else if .Values.importCredentials.credentials }}
        - name: import-credentials
          configMap:
            name: {{ include "eudi-dev.configMapName" . }}
            items:
              {{- range $name, $credential := .Values.importCredentials.credentials }}
              - key: credential-{{ $name }}
                path: {{ $name }}
              {{- end }}
        {{- end }}
        {{- if .Values.extraVolumes }}
        {{- include "common.tplvalues.render" (dict "value" .Values.extraVolumes "context" $) | nindent 8 }}
        {{- end }}
